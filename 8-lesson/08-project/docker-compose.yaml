version: "3.7"

volumes:
  db:

services:
  app:
    build:
      context: .
    command: bash -c "sleep 1; alembic upgrade head && uvicorn --host 0.0.0.0 --reload app.server:get_app "
    ports:
      - "${DOCKER_APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - CLIENT_FAKE=true
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DOCKER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql
